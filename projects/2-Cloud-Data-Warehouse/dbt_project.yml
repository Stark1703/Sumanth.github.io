# dbt Project Configuration for Cloud Data Warehouse

name: 'cloud_data_warehouse'
version: '1.0.0'
config-version: 2

profile: 'snowflake'

model-paths: ['models']
analysis-paths: ['analysis']
test-paths: ['tests']
data-paths: ['data']
macro-paths: ['macros']
snapshot-paths: ['snapshots']
target-path: 'target'
cean-targets:
  - 'target'
  - 'dbt_packages'

require-dbt-version: ['>=1.0.0', '<2.0.0']

vars:
  start_date: '2020-01-01'
  end_date: '2024-12-31'
  lookback_days: 30

models:
  cloud_data_warehouse:
    staging:
      +materialized: view
      +schema: staging
      +tags: ['daily']
    intermediate:
      +materialized: table
      +schema: intermediate
      +tags: ['daily']
    marts:
      +materialized: table
      +schema: marts
      +tags: ['daily']
      +pre-hook: "{% if execute %}{{ log('Building fact tables...', info=true) }}{% endif %}"
      +post-hook: "{% if execute %}{{ log('Fact tables built successfully', info=true) }}{% endif %}"

seeds:
  +schema: seeds
  +quote_columns: false

resources:
  - local_files: ../../dbt_packages
